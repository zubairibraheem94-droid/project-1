<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b16">
  <title>Hello, world — a little moment of magic</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f5ff;
      --muted: #aaa9c3;
      --violet: #a78bfa;
      --pink: #f0abfc;
      --line: rgba(255,255,255,.13);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 28px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 18% 18%, rgba(112, 77, 214, .25), transparent 38%),
        radial-gradient(ellipse at 82% 78%, rgba(219, 93, 196, .17), transparent 34%),
        #090b16;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .stars, .stars::before, .stars::after {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      background-image: radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,.7) 98%, transparent),
                        radial-gradient(1px 1px at 140px 90px, rgba(255,255,255,.48) 98%, transparent),
                        radial-gradient(1.5px 1.5px at 80px 170px, rgba(255,255,255,.6) 98%, transparent);
      background-size: 220px 220px;
      opacity: .32;
      animation: drift 55s linear infinite;
    }
    .stars::before { transform: scale(1.7); opacity: .45; animation-duration: 85s; }
    .stars::after { transform: scale(2.4); opacity: .22; animation-duration: 120s; }

    .scene {
      position: relative;
      width: min(100%, 760px);
      padding: 1px;
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(240,171,252,.55), rgba(167,139,250,.12) 42%, rgba(129,140,248,.5));
      box-shadow: 0 30px 100px rgba(0,0,0,.45), 0 0 80px rgba(167,139,250,.12);
      animation: arrive .9s cubic-bezier(.2,.8,.2,1) both;
    }

    main {
      position: relative;
      overflow: hidden;
      min-height: 440px;
      padding: clamp(34px, 8vw, 72px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      border-radius: 29px;
      background: linear-gradient(145deg, rgba(23,25,44,.96), rgba(15,16,31,.96));
      isolation: isolate;
    }

    main::before {
      position: absolute;
      z-index: -1;
      top: -190px;
      right: -145px;
      width: 430px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(240,171,252,.32), rgba(125,92,229,.12) 42%, transparent 70%);
      filter: blur(3px);
      content: "";
      animation: breathe 7s ease-in-out infinite alternate;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 27px;
      color: #d7c7ff;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .sparkle { color: var(--pink); font-size: 1rem; filter: drop-shadow(0 0 8px rgba(240,171,252,.8)); }

    h1 {
      max-width: 620px;
      margin: 0;
      font-size: clamp(3.6rem, 11vw, 7rem);
      font-weight: 760;
      letter-spacing: -.075em;
      line-height: .94;
    }

    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(100deg, #c4b5fd 8%, #f0abfc 52%, #fbcfe8 95%);
      background-clip: text;
      -webkit-background-clip: text;
    }

    .intro {
      max-width: 440px;
      margin: 25px 0 32px;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.1rem);
      line-height: 1.7;
    }

    .actions { display: flex; align-items: center; gap: 17px; flex-wrap: wrap; }

    button {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-height: 50px;
      padding: 0 21px;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 999px;
      color: #171326;
      background: linear-gradient(100deg, #d8b4fe, #f5b7e9);
      box-shadow: 0 8px 28px rgba(209,155,246,.22);
      font: inherit;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 12px 34px rgba(209,155,246,.35); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    button:active { transform: translateY(0); }

    .hint { color: #8888a5; font-size: .84rem; }

    .footer {
      position: absolute;
      right: clamp(34px, 8vw, 72px);
      bottom: 27px;
      color: #777891;
      font-size: .73rem;
      letter-spacing: .04em;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 2;
      padding: 12px 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(25,26,45,.9);
      box-shadow: 0 12px 35px rgba(0,0,0,.3);
      opacity: 0;
      transform: translate(-50%, 12px);
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: none;
      backdrop-filter: blur(14px);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes drift { to { transform: translate3d(30px, 20px, 0); } }
    @keyframes breathe { to { transform: translate(-24px, 18px) scale(1.08); opacity: .72; } }

    @media (max-width: 540px) {
      body { padding: 16px; }
      main { min-height: 490px; padding-bottom: 82px; }
      .footer { right: 25px; bottom: 22px; }
      .hint { flex-basis: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="scene">
    <main>
      <p class="eyebrow"><span class="sparkle" aria-hidden="true">✦</span> A tiny beginning</p>
      <h1>Hello,<span>world.</span></h1>
      <p class="intro">One small phrase, a whole universe of possibility. Here’s to whatever you make next.</p>
      <div class="actions">
        <button id="hello-button" type="button">Say hello <span aria-hidden="true">↗</span></button>
        <span class="hint">Go on, give it a click.</span>
      </div>
      <span class="footer">MADE WITH A LITTLE MAGIC&nbsp; ✧</span>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite">Hello right back at you ✨</div>
  <script>
    const button = document.querySelector('#hello-button');
    const toast = document.querySelector('#toast');
    let toastTimer;

    button.addEventListener('click', () => {
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    });
  </script>
</body>
</html>
